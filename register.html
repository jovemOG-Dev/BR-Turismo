<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | BR Turismo</title>
    
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/components/header.css">
    <link rel="stylesheet" href="./src/css/components/form.css">
    <link rel="stylesheet" href="./src/css/components/button.css">
    <link rel="stylesheet" href="./src/css/components/footer.css">

    <link rel="stylesheet" href="./src/css/pages/auth.css"> 
</head>
<body>
    
    <header class="header-component">
        </header>

    <main class="auth-page-container">
        <div class="auth-card">
            <h1>Crie sua Conta BR Turismo</h1>
            
            <div id="feedback-message" class="feedback-message error" style="display: none;"></div>

            <form id="register-form">
                
                <div class="form-grid-register">
                    <div class="input-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF (apenas dígitos)</label>
                        <input type="text" id="cpf" name="cpf" maxlength="11" required>
                    </div>
                    <div class="input-group">
                        <label for="birthdate">Data de Nascimento</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required>
                        <small class="form-text">Mínimo 6 caracteres, letras e números.</small>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirme a Senha</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: var(--space-lg);">
                    <label>
                        <input type="checkbox" id="terms" name="terms" required> 
                        Concordo com os <a href="#" target="_blank">Termos de Serviço</a>.
                    </label>
                </div>

                <button type="submit" id="register-btn" class="btn btn-secondary btn-block btn-lg">
                    Cadastrar e Entrar
                </button>
            </form>
            
            <p class="link-switch-auth">
                Já tem conta? <a href="login.html">Faça Login</a>.
            </p>
        </div>
    </main>
    
    <footer class="footer-component">
        </footer>

    <script type="module">
        import { setupMenuToggle } from './src/js/components/menu-toggle.js'; 
        import { initRegisterPage } from './src/js/pages/register.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            setupMenuToggle();      
            initRegisterPage();         
        });
    </script>
</body>
</html>
