<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | BR Turismo</title>
    
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/components/header.css">
    <link rel="stylesheet" href="/src/css/components/form.css">
    <link rel="stylesheet" href="/src/css/components/button.css">
    <link rel="stylesheet" href="/src/css/components/footer.css">

    <link rel="stylesheet" href="/src/css/pages/checkout.css"> 
</head>
<body>
    
    <header class="header-component">
        </header>

    <main>
        <div class="container checkout-layout">
            
            <section id="checkout-form-area" aria-labelledby="checkout-title">
                <h1 id="checkout-title">Finalizar Pedido</h1>
                
                <form id="checkout-form">
                    
                    <div id="login-prompt" style="display: block;">
                        <p>Já tem uma conta? <a href="login.html?redirect=/checkout.html">Faça login</a> para pré-preencher seus dados ou <a href="register.html">Crie sua conta</a>.</p>
                    </div>

                    <div id="user-details-section">
                        <h2 class="form-section-title">1. Dados do Viajante Principal</h2>
                        
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="full-name">Nome Completo</label>
                                <input type="text" id="full-name" name="full-name" required>
                            </div>
                            <div class="input-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="input-group">
                                <label for="cpf">CPF (Apenas dígitos)</label>
                                <input type="text" id="cpf" name="cpf" maxlength="11" required>
                            </div>
                            <div class="input-group">
                                <label for="phone">Telefone</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                        </div>
                    </div>

                    <div id="payment-details-section">
                        <h2 class="form-section-title">2. Informações de Pagamento</h2>
                        
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label for="card-number">Número do Cartão</label>
                                <input type="text" id="card-number" name="card-number" required>
                            </div>
                            <div class="input-group">
                                <label for="card-name">Nome no Cartão</label>
                                <input type="text" id="card-name" name="card-name" required>
                            </div>
                            <div class="input-group">
                                <label for="card-expiry">Validade (MM/AA)</label>
                                <input type="text" id="card-expiry" name="card-expiry" placeholder="MM/AA" required>
                            </div>
                            <div class="input-group">
                                <label for="card-cvv">CVV</label>
                                <input type="text" id="card-cvv" name="card-cvv" maxlength="4" required>
                            </div>
                        </div>
                        
                        <div id="payment-simulated-container" class="text-center" style="margin-top: var(--space-lg);">
                            </div>
                    </div>

                    <div style="margin-top: var(--space-xl);">
                        <button type="submit" id="finalize-btn" class="btn btn-primary btn-block btn-lg">
                            Finalizar Compra e Pagar
                        </button>
                    </div>
                </form>
            </section>

            <aside id="checkout-summary-sidebar" aria-labelledby="summary-title">
                <h2 id="summary-title">Seu Pedido</h2>
                
                <div id="checkout-summary">
                    <p>Carregando itens...</p>
                </div>
                
                <div id="cart-total">
                    </div>

                <p class="disclaimer-text" style="margin-top: var(--space-xl);">
                    Ao clicar em "Finalizar Compra", você concorda com nossos <a href="pages/legal/terms.html">Termos de Uso</a>.
                </p>
            </aside>
        </div>
    </main>
    
    <footer class="footer-component">
        </footer>

    <script type="module">
        import { setupMenuToggle } from '/src/js/components/menu-toggle.js'; 
        import { initCheckoutPage } from '/src/js/pages/checkout.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            setupMenuToggle();      
            initCheckoutPage();         // Inicia a renderização e lógica do checkout
        });
    </script>
</body>
</html>
