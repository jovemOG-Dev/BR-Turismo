<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador | BR Turismo</title>
    
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/components/header.css">
    <link rel="stylesheet" href="./src/css/components/button.css">
    <link rel="stylesheet" href="./src/css/components/footer.css">
    
    <link rel="stylesheet" href="./src/css/pages/user-panel.css"> 
    <link rel="stylesheet" href="./src/css/pages/admin-panel.css"> 
</head>
<body>
    
    <header class="header-component">
        </header>

    <main>
        <div class="container user-panel-layout">
            
            <aside id="panel-sidebar" aria-label="Navegação do Painel Administrativo">
                <h2 style="font-size: 1.1rem; color: var(--color-brand-primary); margin-bottom: var(--space-md); border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-sm);">Admin</h2>
                <nav>
                    <ul class="panel-nav-list">
                        <li class="panel-nav-item active" data-target="dashboard">
                            <a href="#">Dashboard</a>
                        </li>
                        <li class="panel-nav-item" data-target="packages">
                            <a href="#">Gerenciar Pacotes</a>
                        </li>
                        <li class="panel-nav-item" data-target="users">
                            <a href="#">Gerenciar Usuários</a>
                        </li>
                    </ul>
                </nav>
                
                <hr style="margin: var(--space-lg) 0;">
                
                <button id="logout-btn" class="btn btn-danger btn-block" onclick="window.AuthService.logoutAndRedirect('/');">
                    Sair da Conta Admin
                </button>
            </aside>

            <section id="panel-content" aria-live="polite">
                <p>Carregando painel...</p>
            </section>
        </div>
    </main>
    
    <footer class="footer-component">
        </footer>

    <script type="module">
        import { setupMenuToggle } from './src/js/components/menu-toggle.js'; 
        import { initAdminPanel } from './src/js/pages/admin-panel.js';
        import { AuthService } from './src/js/services/auth.js';
        
        // Exporta o serviço para uso global (ex: onclick no botão de logout)
        window.AuthService = AuthService;

        document.addEventListener('DOMContentLoaded', () => {
            setupMenuToggle();      
            initAdminPanel();         
        });
    </script>
</body>
</html>
